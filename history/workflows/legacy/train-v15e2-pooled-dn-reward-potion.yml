name: Train MapleFly v15E2 Pooled DN Reward

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/train-v15e2-pooled-dn-reward-potion.mjs"
      - "history/prereg_v15e2.md"
      - ".github/workflows/train-v15e2-pooled-dn-reward-potion.yml"

permissions:
  contents: read
  actions: read

jobs:
  pooled-dn-reward-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: node --check scripts/train-v15e2-pooled-dn-reward-potion.mjs
      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e
      - name: Run preregistered v15E2 pooled-DN reward learning
        run: node scripts/train-v15e2-pooled-dn-reward-potion.mjs
      - name: Upload v15E2 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15e2-pooled-dn-reward-${{ github.run_id }}
          path: results/train-v15e2-pooled-dn-reward-potion
          if-no-files-found: warn
          retention-days: 30
