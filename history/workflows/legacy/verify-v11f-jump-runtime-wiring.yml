name: Verify v11F Legacy JUMP Isolation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-v11f-jump-runtime-wiring.yml"
      - "src/brain/fly-controller.js"
      - "src/game.js"
      - "src/brain/fly-skill-v11-jump.js"
      - "index.html"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: |
          node --check src/brain/fly-controller.js
          node --check src/game.js
          node --check src/brain/fly-skill-v11-jump.js
      - name: Verify legacy v11F remains isolated
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const controller = fs.readFileSync(
            "src/brain/fly-controller.js",
            "utf8"
          );
          const index = fs.readFileSync(
            "index.html",
            "utf8"
          );

          if (controller.includes(
            "global.MapleFlyJumpSkillV11 ??"
          )) {
            throw new Error(
              "legacy v11F JUMP is wired into controller"
            );
          }
          if (index.includes(
            '<script src="./src/brain/fly-skill-v11-jump.js"></script>'
          )) {
            throw new Error(
              "legacy v11F JUMP is loaded by the page"
            );
          }
          if (!index.includes(
            '<script src="./src/brain/fly-skill-v11h2-jump.js"></script>'
          )) {
            throw new Error(
              "deployed v11H2 JUMP bundle is not loaded"
            );
          }
          if (!fs.existsSync(
            "src/brain/fly-skill-v11-jump.js"
          )) {
            throw new Error(
              "legacy research bundle unexpectedly removed"
            );
          }
          console.log(
            "V11F-LEGACY-ISOLATION=PASS " +
            "oldBundle=preserved oldRuntime=disabled " +
            "h2Runtime=allowed"
          );
          NODE
