name: Validate MapleFly v14C Frozen Candidate

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/brain/fly-interruption-v14b-candidate.json"
      - "scripts/experiment-v14c-frozen-validation.mjs"
      - ".github/workflows/experiment-v14c-frozen-validation.yml"

permissions:
  contents: read

jobs:
  frozen-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: node --check scripts/experiment-v14c-frozen-validation.mjs
      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e
      - name: Validate frozen v14B candidate on unseen v14C seeds
        run: node scripts/experiment-v14c-frozen-validation.mjs
      - name: Upload v14C evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v14c-frozen-validation-${{ github.run_id }}
          path: results/experiment-v14c-frozen-validation
          if-no-files-found: warn
          retention-days: 30
