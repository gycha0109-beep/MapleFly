name: Verify v14C Browser Interruption Wiring

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/brain/fly-controller.js"
      - "src/brain/fly-interruption-v14b.js"
      - "src/brain/fly-interruption-v14b-candidate.json"
      - "index.html"
      - "scripts/verify-v14c-browser-wiring.mjs"
      - ".github/workflows/verify-v14c-browser-wiring.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: |
          node --check src/brain/fly-controller.js
          node --check src/brain/fly-interruption-v14b.js
          node --check scripts/verify-v14c-browser-wiring.mjs
      - name: Verify frozen v14C browser wiring
        run: node scripts/verify-v14c-browser-wiring.mjs
