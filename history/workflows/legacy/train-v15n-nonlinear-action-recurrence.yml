name: Train MapleFly v15N Nonlinear Action Recurrence

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/train-v15n-nonlinear-action-recurrence.mjs"
      - "history/prereg_v15n.md"
      - ".github/workflows/train-v15n-nonlinear-action-recurrence.yml"

permissions:
  contents: read
  actions: read

jobs:
  nonlinear-action-recurrence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: node --check scripts/train-v15n-nonlinear-action-recurrence.mjs
      - name: Verify frozen v15N contract
        run: |
          set -euo pipefail
          grep -q '1db0933739f2a5550ce9c99469933cc07697a9ad' scripts/train-v15n-nonlinear-action-recurrence.mjs
          grep -q 'const V15N_TRAIN_BASE_SEEDS = \[4081000, 4091000, 4101000\];' scripts/train-v15n-nonlinear-action-recurrence.mjs
          grep -q 'const V15N_EVAL_BASE_SEEDS = \[4111000, 4121000, 4131000\];' scripts/train-v15n-nonlinear-action-recurrence.mjs
          grep -q 'const V15N_CEM_SEED = 4168000;' scripts/train-v15n-nonlinear-action-recurrence.mjs
          grep -q 'const V15N_POLICY_PARAMS = 41;' scripts/train-v15n-nonlinear-action-recurrence.mjs
          grep -q 'V15N_NONLINEAR_ACTION_RECURRENCE_PASS' scripts/train-v15n-nonlinear-action-recurrence.mjs
          grep -q 'Math.tanh' scripts/train-v15n-nonlinear-action-recurrence.mjs
          grep -q 'actionStateOff' scripts/train-v15n-nonlinear-action-recurrence.mjs
          grep -q 'neuralOff' scripts/train-v15n-nonlinear-action-recurrence.mjs
          ! grep -q 'previous_4_own_potion_actions' scripts/train-v15n-nonlinear-action-recurrence.mjs
          ! grep -q 'cumulativePotion' scripts/train-v15n-nonlinear-action-recurrence.mjs
      - name: Fetch frozen v15E2 neural core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:a119bc0e425d08c5ce2381e6054c6ee358bf9402d5c442a57c00c916fd3b9405"
          test "$head_sha" = "a04fc64f159079a3e51d6e7ed3663fce25cb83bc"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json
      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e
      - name: Run preregistered v15N nonlinear recurrence
        env:
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/train-v15n-nonlinear-action-recurrence.mjs
      - name: Upload v15N evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15n-nonlinear-action-recurrence-${{ github.run_id }}
          path: results/v15n-nonlinear-action-recurrence
          if-no-files-found: warn
          retention-days: 30
