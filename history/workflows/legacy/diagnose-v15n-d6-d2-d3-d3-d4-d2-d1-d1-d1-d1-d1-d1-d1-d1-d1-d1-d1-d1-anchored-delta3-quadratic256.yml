name: Diagnose MapleFly v15N-D6-D2-D3-D3-D4-D2-D1-D1-D1-D1-D1-D1-D1-D1-D1-D1-D1-D1 Anchored Delta3 Quadratic256

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-anchored-delta3-quadratic256.mjs"
      - "history/prereg_v15n_d6_d2_d3_d3_d4_d2_d1_d1_d1_d1_d1_d1_d1_d1_d1_d1_d1_d1.md"
      - ".github/workflows/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-anchored-delta3-quadratic256.yml"

permissions:
  contents: read
  actions: read

jobs:
  anchored-delta3-quadratic256:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-anchored-delta3-quadratic256.mjs

      - name: Verify frozen quadratic256 contract
        run: |
          set -euo pipefail
          f="scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-anchored-delta3-quadratic256.mjs"
          grep -q 'a14c87c44df31f0d5a349ae1ccc023c6485f1b86' "$f"
          grep -q 'e17825f01a6f1b61ea8035c7c1779c8499a5f08b85aed1da0e7ddbd236ff9764' "$f"
          grep -q '6f2e4c0ec8c7ae438934a1b13db8f062387df3354383b6fab19eac5d8f354105' "$f"
          grep -q '6981000, 6991000, 7001000, 7011000' "$f"
          grep -q '7071000, 7081000, 7091000, 7101000' "$f"
          grep -q '7161000, 7171000, 7181000, 7191000' "$f"
          grep -q '7251000, 7261000, 7271000, 7281000' "$f"
          grep -q 'PCA32_ANCHORED_DELTA3_QUADRATIC256' "$f"
          grep -q 'crossProductsUsed:false' "$f"
          grep -q 'degreeTuned:false' "$f"
          grep -q 'thresholdTunedOnProspective:false' "$f"

      - name: Fetch authoritative failure-attribution evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/failure-attribution
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11205110870" --jq '.workflow_run.head_sha')"
          test "$head_sha" = "8e28d38c6b1a777c96894773c99ae8f49ac1e7cf"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11205110870/zip" > /tmp/failure-attribution.zip
          unzip -q /tmp/failure-attribution.zip -d .cache/failure-attribution
          test -f .cache/failure-attribution/v15n_d6_d2_d3_d3_d4_d2_d1_d1_d1_d1_d1_d1_d1_d1_d1_d1_d1.json

      - name: Fetch frozen v15N candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740/zip" > /tmp/v15n.zip
          unzip -q /tmp/v15n.zip -d .cache/v15n-artifact
          test -f .cache/v15n-artifact/v15n_training.json

      - name: Fetch frozen v15E2 neural core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Run preregistered quadratic256 repair
        env:
          V15N_D6_D2_D3_D3_D4_D2_D1_D1_D1_D1_D1_D1_D1_D1_D1_D1_D1_ARTIFACT_FILE: .cache/failure-attribution/v15n_d6_d2_d3_d3_d4_d2_d1_d1_d1_d1_d1_d1_d1_d1_d1_d1_d1.json
          V15N_ARTIFACT_FILE: .cache/v15n-artifact/v15n_training.json
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-anchored-delta3-quadratic256.mjs

      - name: Upload quadratic256 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-${{ github.run_id }}
          path: results/v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-anchored-delta3-quadratic256
          if-no-files-found: warn
          retention-days: 30
