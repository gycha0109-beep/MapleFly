name: Run MapleFly v11 JUMP Learning Experiment

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/experiment-v11g4-reward-advantage.yml"

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/experiment-v11h2-orthogonal-reward-jump.mjs

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Run v11H2 orthogonal reward-only JUMP
        run: node scripts/experiment-v11h2-orthogonal-reward-jump.mjs

      - name: Upload experiment result
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v11h2-orthogonal-reward-jump-${{ github.run_id }}
          path: results/experiment-v11h2
          if-no-files-found: error
          retention-days: 30

      - name: Print artifact evidence
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "V11H2-ARTIFACT-ID=${ARTIFACT_ID}"
          echo "V11H2-ARTIFACT-DIGEST=${ARTIFACT_DIGEST}"
          test -f results/experiment-v11h2/experiment_v11h2.json
