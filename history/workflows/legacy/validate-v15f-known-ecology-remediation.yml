name: Validate MapleFly v15F Known Ecology Remediation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/validate-v15f-known-ecology-remediation.mjs"
      - "history/prereg_v15f.md"
      - ".github/workflows/validate-v15f-known-ecology-remediation.yml"

permissions:
  contents: read
  actions: read

jobs:
  known-ecology-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: node --check scripts/validate-v15f-known-ecology-remediation.mjs
      - name: Fetch frozen v15E2 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:a119bc0e425d08c5ce2381e6054c6ee358bf9402d5c442a57c00c916fd3b9405"
          test "$head_sha" = "a04fc64f159079a3e51d6e7ed3663fce25cb83bc"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json
      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e
      - name: Run preregistered v15F known-ecology remediation benchmark
        env:
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/validate-v15f-known-ecology-remediation.mjs
      - name: Upload v15F evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15f-known-ecology-remediation-${{ github.run_id }}
          path: results/v15f-known-ecology-remediation
          if-no-files-found: warn
          retention-days: 30
