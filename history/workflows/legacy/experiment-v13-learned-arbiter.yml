name: Run MapleFly v13 Learned Arbiter

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/experiment-v13-learned-arbiter.mjs"
      - ".github/workflows/experiment-v13-learned-arbiter.yml"

permissions:
  contents: read

jobs:
  learned-arbiter:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/experiment-v13-learned-arbiter.mjs

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Train and evaluate learned proposal arbiter
        run: node scripts/experiment-v13-learned-arbiter.mjs

      - name: Upload v13 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v13-learned-arbiter-${{ github.run_id }}
          path: results/experiment-v13-learned-arbiter
          if-no-files-found: warn
          retention-days: 30
