name: Diagnose MapleFly v15N-D6-D2-D3-D3-D4-D2-D1-D1-D1-D1 Three-Class Failure Attribution

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-three-class-failure-attribution.mjs"
      - "history/prereg_v15n_d6_d2_d3_d3_d4_d2_d1_d1_d1_d1.md"
      - ".github/workflows/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-three-class-failure-attribution.yml"

permissions:
  contents: read
  actions: read

jobs:
  three-class-failure-attribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-three-class-failure-attribution.mjs

      - name: Verify frozen attribution contract
        run: |
          set -euo pipefail
          f="scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-three-class-failure-attribution.mjs"
          grep -q '66e1882613b60a89aafed9ff48139fd5474d5b38' "$f"
          grep -q 'cc1c5fb57b7363fe8e936d5a67854bb4ee754c2472e30071f89888643e9678b7' "$f"
          grep -q 'MARGIN_SEPARABLE' "$f"
          grep -q 'MARGIN_NOT_SEPARABLE' "$f"
          grep -q 'TRUE_BACKGROUND_ENTRY_DOMINANT' "$f"
          grep -q 'NO_REALIZED_DOMINANT' "$f"
          grep -q 'thresholdTuned: false' "$f"
          grep -q 'marginThresholdTuned: false' "$f"
          grep -q 'temporalDepthTuned: false' "$f"
          grep -q 'refractoryTuned: false' "$f"

      - name: Fetch authoritative three-class evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/three-class
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11040692357" --jq '.workflow_run.head_sha')"
          test "$head_sha" = "10924c03c63dcf23d6cf8dbe15a8796b08bce2f9"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11040692357/zip" > /tmp/threeclass.zip
          unzip -q /tmp/threeclass.zip -d .cache/three-class
          test -f .cache/three-class/v15n_d6_d2_d3_d3_d4_d2_d1_d1_d1.json

      - name: Fetch frozen v15N candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740/zip" > /tmp/v15n.zip
          unzip -q /tmp/v15n.zip -d .cache/v15n-artifact
          test -f .cache/v15n-artifact/v15n_training.json

      - name: Fetch frozen v15E2 neural core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Run preregistered three-class failure attribution
        env:
          V15N_D6_D2_D3_D3_D4_D2_D1_D1_D1_ARTIFACT_FILE: .cache/three-class/v15n_d6_d2_d3_d3_d4_d2_d1_d1_d1.json
          V15N_ARTIFACT_FILE: .cache/v15n-artifact/v15n_training.json
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-three-class-failure-attribution.mjs

      - name: Upload three-class attribution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-${{ github.run_id }}
          path: results/v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-three-class-failure-attribution
          if-no-files-found: warn
          retention-days: 30
