name: Diagnose MapleFly v15N-D6-D2-D3-D3-D4 Temporal Shape Observability

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/diagnose-v15n-d6-d2-d3-d3-d4-causal-pca32-temporal-shape-observability.mjs"
      - "history/prereg_v15n_d6_d2_d3_d3_d4.md"
      - ".github/workflows/diagnose-v15n-d6-d2-d3-d3-d4-causal-pca32-temporal-shape-observability.yml"

permissions:
  contents: read
  actions: read

jobs:
  temporal-shape-observability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/diagnose-v15n-d6-d2-d3-d3-d4-causal-pca32-temporal-shape-observability.mjs

      - name: Verify frozen v15N-D6-D2-D3-D3-D4 contract
        run: |
          set -euo pipefail
          grep -q '3186c1c107be4dfca25a59db0a4d70a2016f31b9' scripts/diagnose-v15n-d6-d2-d3-d3-d4-causal-pca32-temporal-shape-observability.mjs
          grep -q '778ef1d800af2a6f8e14e3f86ded08ad91ee571b6ba60257da714f914daef3f0' scripts/diagnose-v15n-d6-d2-d3-d3-d4-causal-pca32-temporal-shape-observability.mjs
          grep -q 'V15N_D6_D2_D3_D3_D4_GATE = 0.75' scripts/diagnose-v15n-d6-d2-d3-d3-d4-causal-pca32-temporal-shape-observability.mjs
          grep -q 'oldScalarGateUsed: false' scripts/diagnose-v15n-d6-d2-d3-d3-d4-causal-pca32-temporal-shape-observability.mjs
          grep -q 'temporalDepth: 3' scripts/diagnose-v15n-d6-d2-d3-d3-d4-causal-pca32-temporal-shape-observability.mjs
          grep -q 'evaluatorLabelsUsedForTraining: true' scripts/diagnose-v15n-d6-d2-d3-d3-d4-causal-pca32-temporal-shape-observability.mjs

      - name: Fetch authoritative v15N-D6-D2-D3-D3-D3-D1-D1 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-d6-d2-d3-d3-d3-d1-d1-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10993630636" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10993630636" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:d5e74ac8f50cd44087dbd947ab72f5309706546a25d3906c0b4212e841108f08"
          test "$head_sha" = "f8c6aa860d7a259a96410e809aac706595c3bd58"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10993630636/zip" > /tmp/v15n-d6-d2-d3-d3-d3-d1-d1.zip
          unzip -q /tmp/v15n-d6-d2-d3-d3-d3-d1-d1.zip -d .cache/v15n-d6-d2-d3-d3-d3-d1-d1-artifact
          test -f .cache/v15n-d6-d2-d3-d3-d3-d1-d1-artifact/v15n_d6_d2_d3_d3_d3_d1_d1.json
          echo "778ef1d800af2a6f8e14e3f86ded08ad91ee571b6ba60257da714f914daef3f0  .cache/v15n-d6-d2-d3-d3-d3-d1-d1-artifact/v15n_d6_d2_d3_d3_d3_d1_d1.json" | sha256sum -c -

      - name: Fetch frozen v15N candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:2a4492b371eaaaccaf12cbb29f5062708833e722d0af111a50e7cd0112abf6e2"
          test "$head_sha" = "d3e434fc5a9f9a8b9e83d96637b25e2058398274"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740/zip" > /tmp/v15n.zip
          unzip -q /tmp/v15n.zip -d .cache/v15n-artifact
          test -f .cache/v15n-artifact/v15n_training.json
          echo "103e3ebc84e7d062394ec22608b533cfc135c89eedc766f7f7c682a6dcdcd1a4  .cache/v15n-artifact/v15n_training.json" | sha256sum -c -

      - name: Fetch frozen v15E2 neural core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:a119bc0e425d08c5ce2381e6054c6ee358bf9402d5c442a57c00c916fd3b9405"
          test "$head_sha" = "a04fc64f159079a3e51d6e7ed3663fce25cb83bc"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Run preregistered v15N-D6-D2-D3-D3-D4 temporal-shape audit
        env:
          V15N_D6_D2_D3_D3_D3_D1_D1_ARTIFACT_FILE: .cache/v15n-d6-d2-d3-d3-d3-d1-d1-artifact/v15n_d6_d2_d3_d3_d3_d1_d1.json
          V15N_ARTIFACT_FILE: .cache/v15n-artifact/v15n_training.json
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/diagnose-v15n-d6-d2-d3-d3-d4-causal-pca32-temporal-shape-observability.mjs

      - name: Upload v15N-D6-D2-D3-D3-D4 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15n-d6-d2-d3-d3-d4-temporal-shape-${{ github.run_id }}
          path: results/v15n-d6-d2-d3-d3-d4-causal-pca32-temporal-shape-observability
          if-no-files-found: warn
          retention-days: 30
