name: Diagnose MapleFly v15N-D6-D2-D3-D3-D2 Delayed Max Observability

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/diagnose-v15n-d6-d2-d3-d3-d2-causal-200ms-delayed-max-observability.mjs"
      - "history/prereg_v15n_d6_d2_d3_d3_d2.md"
      - ".github/workflows/diagnose-v15n-d6-d2-d3-d3-d2-causal-200ms-delayed-max-observability.yml"

permissions:
  contents: read
  actions: read

jobs:
  delayed-max-observability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/diagnose-v15n-d6-d2-d3-d3-d2-causal-200ms-delayed-max-observability.mjs

      - name: Verify frozen v15N-D6-D2-D3-D3-D2 contract
        run: |
          set -euo pipefail
          grep -q 'e2817b8b20b40d38cb08e891b75fcdcdc979624e' scripts/diagnose-v15n-d6-d2-d3-d3-d2-causal-200ms-delayed-max-observability.mjs
          grep -q 'bbc1aac5878949a118fe8c4ea51117695dd2cdea040461c9e4de358fbfdaf57b' scripts/diagnose-v15n-d6-d2-d3-d3-d2-causal-200ms-delayed-max-observability.mjs
          grep -q 'V15N_D6_D2_D3_D3_D2_TAPES_PER_PROSPECTIVE = 64' scripts/diagnose-v15n-d6-d2-d3-d3-d2-causal-200ms-delayed-max-observability.mjs
          grep -q 'V15N_D6_D2_D3_D3_D2_GATE = 0.75' scripts/diagnose-v15n-d6-d2-d3-d3-d2-causal-200ms-delayed-max-observability.mjs
          grep -q 'oracleWindowBoundariesForDiagnostic: true' scripts/diagnose-v15n-d6-d2-d3-d3-d2-causal-200ms-delayed-max-observability.mjs
          grep -q 'replacementEventizerEvaluated: false' scripts/diagnose-v15n-d6-d2-d3-d3-d2-causal-200ms-delayed-max-observability.mjs

      - name: Fetch authoritative v15N-D6-D2-D3-D3-D1 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-d6-d2-d3-d3-d1-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10939890187" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10939890187" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:1c3b32cf3266299401d2326ffd7874428e1bdefb50607d74c7d1c3e8855fcd36"
          test "$head_sha" = "1fbef4fb89903db91b12a992a51faf7294dc7d31"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10939890187/zip" > /tmp/v15n-d6-d2-d3-d3-d1.zip
          unzip -q /tmp/v15n-d6-d2-d3-d3-d1.zip -d .cache/v15n-d6-d2-d3-d3-d1-artifact
          test -f .cache/v15n-d6-d2-d3-d3-d1-artifact/v15n_d6_d2_d3_d3_d1.json
          echo "bbc1aac5878949a118fe8c4ea51117695dd2cdea040461c9e4de358fbfdaf57b  .cache/v15n-d6-d2-d3-d3-d1-artifact/v15n_d6_d2_d3_d3_d1.json" | sha256sum -c -

      - name: Fetch frozen v15N candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:2a4492b371eaaaccaf12cbb29f5062708833e722d0af111a50e7cd0112abf6e2"
          test "$head_sha" = "d3e434fc5a9f9a8b9e83d96637b25e2058398274"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740/zip" > /tmp/v15n.zip
          unzip -q /tmp/v15n.zip -d .cache/v15n-artifact
          test -f .cache/v15n-artifact/v15n_training.json
          echo "103e3ebc84e7d062394ec22608b533cfc135c89eedc766f7f7c682a6dcdcd1a4  .cache/v15n-artifact/v15n_training.json" | sha256sum -c -

      - name: Fetch frozen v15E2 neural core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:a119bc0e425d08c5ce2381e6054c6ee358bf9402d5c442a57c00c916fd3b9405"
          test "$head_sha" = "a04fc64f159079a3e51d6e7ed3663fce25cb83bc"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Run preregistered v15N-D6-D2-D3-D3-D2 delayed-max observability audit
        env:
          V15N_D6_D2_D3_D3_D1_ARTIFACT_FILE: .cache/v15n-d6-d2-d3-d3-d1-artifact/v15n_d6_d2_d3_d3_d1.json
          V15N_ARTIFACT_FILE: .cache/v15n-artifact/v15n_training.json
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/diagnose-v15n-d6-d2-d3-d3-d2-causal-200ms-delayed-max-observability.mjs

      - name: Upload v15N-D6-D2-D3-D3-D2 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15n-d6-d2-d3-d3-d2-delayed-max-${{ github.run_id }}
          path: results/v15n-d6-d2-d3-d3-d2-causal-200ms-delayed-max-observability
          if-no-files-found: warn
          retention-days: 30
