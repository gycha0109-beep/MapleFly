name: Diagnose MapleFly v15M-D2 Scalar Action State

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/diagnose-v15m-d2-scalar-action-state.mjs"
      - "history/prereg_v15m_d2.md"
      - ".github/workflows/diagnose-v15m-d2-scalar-action-state.yml"

permissions:
  contents: read
  actions: read

jobs:
  scalar-action-state-upper-bound:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: node --check scripts/diagnose-v15m-d2-scalar-action-state.mjs
      - name: Verify frozen D2 contract
        run: |
          set -euo pipefail
          grep -q '59ca34a3edd103489bb98f09b325ef3915d43b59' scripts/diagnose-v15m-d2-scalar-action-state.mjs
          grep -q 'V15M_D2_BASE_SEEDS = \[4001000, 4011000, 4021000\]' scripts/diagnose-v15m-d2-scalar-action-state.mjs
          grep -q 'V15M_D2_INTERRUPTION_SEED = 4037000' scripts/diagnose-v15m-d2-scalar-action-state.mjs
          grep -q 'V15M_D2_MIN_FORCED_SUPPORT = 500' scripts/diagnose-v15m-d2-scalar-action-state.mjs
          grep -q 'V15M_D2_SCALAR_ACTION_STATE_BOTTLENECK' scripts/diagnose-v15m-d2-scalar-action-state.mjs
          grep -q 'V15M_D2_SCALAR_ACTION_STATE_NOT_RULED_OUT' scripts/diagnose-v15m-d2-scalar-action-state.mjs
          grep -q 'replacementPolicyTrained: false' scripts/diagnose-v15m-d2-scalar-action-state.mjs
      - name: Fetch frozen v15E2 neural core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:a119bc0e425d08c5ce2381e6054c6ee358bf9402d5c442a57c00c916fd3b9405"
          test "$head_sha" = "a04fc64f159079a3e51d6e7ed3663fce25cb83bc"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json
      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e
      - name: Run preregistered v15M-D2 upper-bound audit
        env:
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/diagnose-v15m-d2-scalar-action-state.mjs
      - name: Upload v15M-D2 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15m-d2-scalar-action-state-${{ github.run_id }}
          path: results/v15m-d2-scalar-action-state-upper-bound
          if-no-files-found: warn
          retention-days: 30
