name: Diagnose MapleFly v15N-D6-D2-D3-D3-D2-D1 Background Fate Attribution

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/diagnose-v15n-d6-d2-d3-d3-d2-d1-background-window-fate-attribution.mjs"
      - "history/prereg_v15n_d6_d2_d3_d3_d2_d1.md"
      - ".github/workflows/diagnose-v15n-d6-d2-d3-d3-d2-d1-background-window-fate-attribution.yml"

permissions:
  contents: read
  actions: read

jobs:
  background-fate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/diagnose-v15n-d6-d2-d3-d3-d2-d1-background-window-fate-attribution.mjs

      - name: Verify frozen v15N-D6-D2-D3-D3-D2-D1 contract
        run: |
          set -euo pipefail
          grep -q '24a425cd4a3af8f078545fee723a64ef96ba8dfb' scripts/diagnose-v15n-d6-d2-d3-d3-d2-d1-background-window-fate-attribution.mjs
          grep -q '5273efaf28c24415ae3372f9a9380f2821ba0de017bc57bf8e9baf0daa5fd1da' scripts/diagnose-v15n-d6-d2-d3-d3-d2-d1-background-window-fate-attribution.mjs
          grep -q 'V15N_D6_D2_D3_D3_D2_D1_FUTURE_HIT_GATE = 0.90' scripts/diagnose-v15n-d6-d2-d3-d3-d2-d1-background-window-fate-attribution.mjs
          grep -q 'V15N_D6_D2_D3_D3_D2_D1_HIT_FREE_GATE = 0.60' scripts/diagnose-v15n-d6-d2-d3-d3-d2-d1-background-window-fate-attribution.mjs
          grep -q 'replacementEventizerEvaluated: false' scripts/diagnose-v15n-d6-d2-d3-d3-d2-d1-background-window-fate-attribution.mjs

      - name: Fetch authoritative v15N-D6-D2-D3-D3-D2 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-d6-d2-d3-d3-d2-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10939579823" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10939579823" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:102a5308585a923f0134fb26cc202038fa6c553072969a4e08a393561bafd1d3"
          test "$head_sha" = "464f6979baf3348e9da0ed3c767fc5559627c220"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10939579823/zip" > /tmp/v15n-d6-d2-d3-d3-d2.zip
          unzip -q /tmp/v15n-d6-d2-d3-d3-d2.zip -d .cache/v15n-d6-d2-d3-d3-d2-artifact
          test -f .cache/v15n-d6-d2-d3-d3-d2-artifact/v15n_d6_d2_d3_d3_d2.json
          echo "5273efaf28c24415ae3372f9a9380f2821ba0de017bc57bf8e9baf0daa5fd1da  .cache/v15n-d6-d2-d3-d3-d2-artifact/v15n_d6_d2_d3_d3_d2.json" | sha256sum -c -

      - name: Fetch frozen v15N candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:2a4492b371eaaaccaf12cbb29f5062708833e722d0af111a50e7cd0112abf6e2"
          test "$head_sha" = "d3e434fc5a9f9a8b9e83d96637b25e2058398274"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740/zip" > /tmp/v15n.zip
          unzip -q /tmp/v15n.zip -d .cache/v15n-artifact
          test -f .cache/v15n-artifact/v15n_training.json
          echo "103e3ebc84e7d062394ec22608b533cfc135c89eedc766f7f7c682a6dcdcd1a4  .cache/v15n-artifact/v15n_training.json" | sha256sum -c -

      - name: Fetch frozen v15E2 neural core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:a119bc0e425d08c5ce2381e6054c6ee358bf9402d5c442a57c00c916fd3b9405"
          test "$head_sha" = "a04fc64f159079a3e51d6e7ed3663fce25cb83bc"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Run preregistered v15N-D6-D2-D3-D3-D2-D1 background fate attribution
        env:
          V15N_D6_D2_D3_D3_D2_ARTIFACT_FILE: .cache/v15n-d6-d2-d3-d3-d2-artifact/v15n_d6_d2_d3_d3_d2.json
          V15N_ARTIFACT_FILE: .cache/v15n-artifact/v15n_training.json
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/diagnose-v15n-d6-d2-d3-d3-d2-d1-background-window-fate-attribution.mjs

      - name: Upload v15N-D6-D2-D3-D3-D2-D1 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15n-d6-d2-d3-d3-d2-d1-background-fate-${{ github.run_id }}
          path: results/v15n-d6-d2-d3-d3-d2-d1-background-window-fate-attribution
          if-no-files-found: warn
          retention-days: 30
