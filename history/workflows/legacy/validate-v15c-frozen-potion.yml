name: Validate MapleFly v15C Frozen Potion

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/validate-v15c-frozen-potion.mjs"
      - ".github/workflows/validate-v15c-frozen-potion.yml"

permissions:
  contents: read
  actions: read

jobs:
  frozen-potion-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: node --check scripts/validate-v15c-frozen-potion.mjs
      - name: Fetch frozen v15A12 representation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15a12-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10768761312" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10768761312" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:8aa759b04643d618e69aaa647d7251eb237816ee3b84bcc97a0f451d20cbba78"
          test "$head_sha" = "353bbdc91bbe125434c1263d8c8d1be308e1844d"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10768761312/zip" > /tmp/v15a12.zip
          unzip -q /tmp/v15a12.zip -d .cache/v15a12-artifact
          test -f .cache/v15a12-artifact/v15a12_screen.json
      - name: Fetch frozen v15B3 policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15b3-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10770299335" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10770299335" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:3f715ef7f4f62e854db02c4e0f05b8662d5dab2a46d1ea0675320bffbe3bc838"
          test "$head_sha" = "6b82a15f2009779c945c19aa227a5d79a51a47b6"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10770299335/zip" > /tmp/v15b3.zip
          unzip -q /tmp/v15b3.zip -d .cache/v15b3-artifact
          test -f .cache/v15b3-artifact/v15b3_training.json
      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e
      - name: Run preregistered v15C frozen-policy holdout
        env:
          V15A12_REPRESENTATION_FILE: .cache/v15a12-artifact/v15a12_screen.json
          V15B3_MODEL_FILE: .cache/v15b3-artifact/v15b3_training.json
        run: node scripts/validate-v15c-frozen-potion.mjs
      - name: Upload v15C evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15c-frozen-potion-${{ github.run_id }}
          path: results/validate-v15c-frozen-potion
          if-no-files-found: warn
          retention-days: 30
