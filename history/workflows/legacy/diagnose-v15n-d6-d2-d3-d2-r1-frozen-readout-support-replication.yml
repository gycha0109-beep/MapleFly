name: Diagnose MapleFly v15N-D6-D2-D3-D2-R1 Frozen Readout Support

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/diagnose-v15n-d6-d2-d3-d2-r1-frozen-readout-support-replication.mjs"
      - "history/prereg_v15n_d6_d2_d3_d2_r1.md"
      - ".github/workflows/diagnose-v15n-d6-d2-d3-d2-r1-frozen-readout-support-replication.yml"

permissions:
  contents: read
  actions: read

jobs:
  frozen-readout-support:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: node --check scripts/diagnose-v15n-d6-d2-d3-d2-r1-frozen-readout-support-replication.mjs
      - name: Verify frozen v15N-D6-D2-D3-D2-R1 contract
        run: |
          set -euo pipefail
          grep -q 'cc13947c32c9892a5d748eeaa4977800c1ffae2c' scripts/diagnose-v15n-d6-d2-d3-d2-r1-frozen-readout-support-replication.mjs
          grep -q 'e0d51061e0d32f2bdf373da213e71c4758258c9df236cf9238b604c91c598347' scripts/diagnose-v15n-d6-d2-d3-d2-r1-frozen-readout-support-replication.mjs
          grep -q 'V15N_D6_D2_D3_D2_R1_TAPES_PER_REPLICATION = 64' scripts/diagnose-v15n-d6-d2-d3-d2-r1-frozen-readout-support-replication.mjs
          grep -q '13f38c51f80d3392e8649a6438154410ba250e78836e02134e2521f24ffd1f82' scripts/diagnose-v15n-d6-d2-d3-d2-r1-frozen-readout-support-replication.mjs
          grep -q 'replacementEventizerEvaluated: false' scripts/diagnose-v15n-d6-d2-d3-d2-r1-frozen-readout-support-replication.mjs
      - name: Fetch authoritative v15N-D6-D2-D3-D2 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-d6-d2-d3-d2-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10915626754" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10915626754" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:edf821f959746bda8a757e895779d18ac1953fc33457a9635a5d1113facaae5c"
          test "$head_sha" = "57c6bda8a8d52025c00e8d0ab5d2bd7fa42b8226"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10915626754/zip" > /tmp/v15n-d6-d2-d3-d2.zip
          unzip -q /tmp/v15n-d6-d2-d3-d2.zip -d .cache/v15n-d6-d2-d3-d2-artifact
          test -f .cache/v15n-d6-d2-d3-d2-artifact/v15n_d6_d2_d3_d2.json
          echo "e0d51061e0d32f2bdf373da213e71c4758258c9df236cf9238b604c91c598347  .cache/v15n-d6-d2-d3-d2-artifact/v15n_d6_d2_d3_d2.json" | sha256sum -c -
      - name: Fetch frozen v15N candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:2a4492b371eaaaccaf12cbb29f5062708833e722d0af111a50e7cd0112abf6e2"
          test "$head_sha" = "d3e434fc5a9f9a8b9e83d96637b25e2058398274"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740/zip" > /tmp/v15n.zip
          unzip -q /tmp/v15n.zip -d .cache/v15n-artifact
          test -f .cache/v15n-artifact/v15n_training.json
          echo "103e3ebc84e7d062394ec22608b533cfc135c89eedc766f7f7c682a6dcdcd1a4  .cache/v15n-artifact/v15n_training.json" | sha256sum -c -
      - name: Fetch frozen v15E2 neural core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:a119bc0e425d08c5ce2381e6054c6ee358bf9402d5c442a57c00c916fd3b9405"
          test "$head_sha" = "a04fc64f159079a3e51d6e7ed3663fce25cb83bc"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json
      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e
      - name: Run preregistered v15N-D6-D2-D3-D2-R1 support replication
        env:
          V15N_D6_D2_D3_D2_ARTIFACT_FILE: .cache/v15n-d6-d2-d3-d2-artifact/v15n_d6_d2_d3_d2.json
          V15N_ARTIFACT_FILE: .cache/v15n-artifact/v15n_training.json
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/diagnose-v15n-d6-d2-d3-d2-r1-frozen-readout-support-replication.mjs
      - name: Upload v15N-D6-D2-D3-D2-R1 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15n-d6-d2-d3-d2-r1-frozen-readout-support-${{ github.run_id }}
          path: results/v15n-d6-d2-d3-d2-r1-frozen-readout-support-replication
          if-no-files-found: warn
          retention-days: 30
