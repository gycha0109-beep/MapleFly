name: Diagnose MapleFly v15A LgLG Propagation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/diagnose-v15a-lglg-propagation.mjs"
      - ".github/workflows/diagnose-v15a-lglg-propagation.yml"

permissions:
  contents: read

jobs:
  propagation-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: node --check scripts/diagnose-v15a-lglg-propagation.mjs
      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e
      - name: Run preregistered v15A propagation diagnostic
        run: node scripts/diagnose-v15a-lglg-propagation.mjs
      - name: Upload v15A diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15a-lglg-propagation-${{ github.run_id }}
          path: results/diagnose-v15a-lglg-propagation
          if-no-files-found: warn
          retention-days: 30
