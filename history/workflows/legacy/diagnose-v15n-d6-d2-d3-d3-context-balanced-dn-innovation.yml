name: Diagnose MapleFly v15N-D6-D2-D3-D3 Context Balanced DN Innovation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/diagnose-v15n-d6-d2-d3-d3-context-balanced-dn-innovation.mjs"
      - "history/prereg_v15n_d6_d2_d3_d3.md"
      - ".github/workflows/diagnose-v15n-d6-d2-d3-d3-context-balanced-dn-innovation.yml"

permissions:
  contents: read
  actions: read

jobs:
  context-balanced-dn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/diagnose-v15n-d6-d2-d3-d3-context-balanced-dn-innovation.mjs

      - name: Verify frozen v15N-D6-D2-D3-D3 contract
        run: |
          set -euo pipefail
          grep -q '47d45be53043af245ebbb690322880fdbda9b8e4' scripts/diagnose-v15n-d6-d2-d3-d3-context-balanced-dn-innovation.mjs
          grep -q 'ff70bf5055712b48cc08b1dca3ee0c50ba8836ed2c501342fa5d49713e4f8a42' scripts/diagnose-v15n-d6-d2-d3-d3-context-balanced-dn-innovation.mjs
          grep -q 'b187f3de9229e14260b8d1464e20fa3b8d26158a715a5372e4696c1bf3b7fb33' scripts/diagnose-v15n-d6-d2-d3-d3-context-balanced-dn-innovation.mjs
          grep -q 'V15N_D6_D2_D3_D3_TAPES_PER_PROSPECTIVE = 64' scripts/diagnose-v15n-d6-d2-d3-d3-context-balanced-dn-innovation.mjs
          grep -q 'V15N_D6_D2_D3_D3_GATE = 0.75' scripts/diagnose-v15n-d6-d2-d3-d3-context-balanced-dn-innovation.mjs
          grep -q 'subtypeRecallsGated: true' scripts/diagnose-v15n-d6-d2-d3-d3-context-balanced-dn-innovation.mjs

      - name: Fetch authoritative R1 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-d6-d2-d3-d2-r1-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10921791405" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10921791405" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:f31af207cc78cc938c0465e561f0d8f11762dd51830e8785157e6b4f24c9c8b7"
          test "$head_sha" = "1c501bd3e6a172a6902cc47bc6df80490d643ed9"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10921791405/zip" > /tmp/v15n-d6-d2-d3-d2-r1.zip
          unzip -q /tmp/v15n-d6-d2-d3-d2-r1.zip -d .cache/v15n-d6-d2-d3-d2-r1-artifact
          test -f .cache/v15n-d6-d2-d3-d2-r1-artifact/v15n_d6_d2_d3_d2_r1.json
          echo "ff70bf5055712b48cc08b1dca3ee0c50ba8836ed2c501342fa5d49713e4f8a42  .cache/v15n-d6-d2-d3-d2-r1-artifact/v15n_d6_d2_d3_d2_r1.json" | sha256sum -c -

      - name: Fetch frozen v15N candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:2a4492b371eaaaccaf12cbb29f5062708833e722d0af111a50e7cd0112abf6e2"
          test "$head_sha" = "d3e434fc5a9f9a8b9e83d96637b25e2058398274"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740/zip" > /tmp/v15n.zip
          unzip -q /tmp/v15n.zip -d .cache/v15n-artifact
          test -f .cache/v15n-artifact/v15n_training.json
          echo "103e3ebc84e7d062394ec22608b533cfc135c89eedc766f7f7c682a6dcdcd1a4  .cache/v15n-artifact/v15n_training.json" | sha256sum -c -

      - name: Fetch frozen v15E2 neural core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:a119bc0e425d08c5ce2381e6054c6ee358bf9402d5c442a57c00c916fd3b9405"
          test "$head_sha" = "a04fc64f159079a3e51d6e7ed3663fce25cb83bc"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Run preregistered v15N-D6-D2-D3-D3 context-balanced DN innovation audit
        env:
          V15N_D6_D2_D3_D2_R1_ARTIFACT_FILE: .cache/v15n-d6-d2-d3-d2-r1-artifact/v15n_d6_d2_d3_d2_r1.json
          V15N_ARTIFACT_FILE: .cache/v15n-artifact/v15n_training.json
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/diagnose-v15n-d6-d2-d3-d3-context-balanced-dn-innovation.mjs

      - name: Upload v15N-D6-D2-D3-D3 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15n-d6-d2-d3-d3-context-balanced-dn-${{ github.run_id }}
          path: results/v15n-d6-d2-d3-d3-context-balanced-dn-innovation
          if-no-files-found: warn
          retention-days: 30
