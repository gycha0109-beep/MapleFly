<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MapleFly Test Map v1</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">MAPLEFLY</p>
        <h1>Test Map v1</h1>
      </div>
      <div class="controls" aria-label="debug controls">
        <span>A/D 또는 ←/→ 이동</span>
        <span>W/S 또는 ↑/↓ 사다리</span>
        <span>Space 점프</span>
        <span>F 공격</span>
        <span>R 전체 리셋</span>
      </div>
    </header>

    <section class="game-frame">
      <canvas
        id="game"
        width="1000"
        height="600"
        aria-label="MapleFly simplified test map"
      ></canvas>
      <div class="statusbar">
        <span id="position">x 0 · y 0</span>
        <span id="combat">ATK 10 · HITS 0 · KILLS 0</span>
        <span id="state">GROUND</span>
      </div>
    </section>

    <p class="note">
      전투 베이스라인: 버섯은 개체별 HP를 가지며, 현재 플레이어 공격력은 10입니다.
      초파리 connectome과 몬스터 AI는 아직 연결하지 않습니다.
    </p>
  </main>

  <script src="./src/game.js"></script>
</body>
</html>
