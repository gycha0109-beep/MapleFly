name: MapleFly CI Architecture Guard

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "science/**"
      - "scripts/ci/**"
      - "scripts/lib/tape-pack-cache.mjs"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "science/**"
      - "scripts/ci/**"
      - "scripts/lib/tape-pack-cache.mjs"

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate workflow policy
        run: node scripts/ci/validate-workflow-policy.mjs
      - name: Test Tape Pack cache
        run: node scripts/ci/test-tape-pack-cache.mjs

      - name: Check cached science base
        run: |
          node --check scripts/lib/v15n-tape-cache.mjs
          node --check scripts/science/build-v15n-tapes.mjs
          node --check scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-d1-neural-only-predictive-surprise32.mjs
          node scripts/ci/tape-pack-identity.mjs             science/simulations/v15n-deterministic-v3.json             science/cohorts/neural-only-predictive-surprise32.json             train > /tmp/maplefly-tape-identity.json
          grep -q '"key"' /tmp/maplefly-tape-identity.json
