name: Verify v11F JUMP Deployment State

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-v11f-jump-runtime-wiring.yml"
      - "src/brain/fly-controller.js"
      - "src/game.js"
      - "src/brain/fly-skill-v11-jump.js"
      - "index.html"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: |
          node --check src/brain/fly-controller.js
          node --check src/game.js
          node --check src/brain/fly-skill-v11-jump.js
      - name: Verify fail-closed deployment state
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const controller = fs.readFileSync(
            "src/brain/fly-controller.js",
            "utf8"
          );
          const game = fs.readFileSync(
            "src/game.js",
            "utf8"
          );
          const index = fs.readFileSync(
            "index.html",
            "utf8"
          );

          if (controller.includes("MapleFlyJumpSkillV11")) {
            throw new Error("learned JUMP is still wired into controller");
          }
          if (controller.includes('id: "jump"')) {
            throw new Error("JUMP sampler is still active");
          }
          if (game.includes("JUMP_TUTORIAL")) {
            throw new Error("JUMP tutorial obstacle is still active");
          }
          if (!index.includes(
            '<script src="./src/brain/fly-skill-v11-jump.js"></script>'
          )) {
            throw new Error("research bundle unexpectedly removed");
          }
          console.log(
            "V11F-JUMP-DEPLOYMENT=WITHHELD " +
            "bundle=preserved controller=disabled arena=restored"
          );
          NODE
