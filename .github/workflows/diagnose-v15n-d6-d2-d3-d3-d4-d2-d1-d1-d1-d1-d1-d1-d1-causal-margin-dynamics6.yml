name: Diagnose MapleFly v15N-D6-D2-D3-D3-D4-D2-D1-D1-D1-D1-D1-D1-D1 Causal Margin Dynamics6

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-d1-d1-causal-margin-dynamics6.mjs"
      - "history/prereg_v15n_d6_d2_d3_d3_d4_d2_d1_d1_d1_d1_d1_d1_d1.md"
      - ".github/workflows/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-d1-d1-causal-margin-dynamics6.yml"

permissions:
  contents: read
  actions: read

jobs:
  causal-margin-dynamics6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-d1-d1-causal-margin-dynamics6.mjs

      - name: Verify frozen DYNAMICS6 contract
        run: |
          set -euo pipefail
          f="scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-d1-d1-causal-margin-dynamics6.mjs"
          grep -q '4c68906e0fb675bd607dbdf0f234f824cb512d33' "$f"
          grep -q '21f2b96ff0f94534b88aa329ae34c11441d42123226953da3884bedf394041f7' "$f"
          grep -q '6081000, 6091000, 6101000, 6111000' "$f"
          grep -q '6171000, 6181000, 6191000, 6201000' "$f"
          grep -q '6261000, 6271000, 6281000, 6291000' "$f"
          grep -q '6351000, 6361000, 6371000, 6381000' "$f"
          grep -q 'thresholdTunedOnProspective:' "$f"
          grep -q 'temporalDepthTuned:' "$f"
          grep -q 'refractoryTuned:' "$f"

      - name: Fetch authoritative margin-crossing attribution evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/margin-attribution
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11101046573" --jq '.workflow_run.head_sha')"
          test "$head_sha" = "e97dbabbbabc0f2cb2de16e31bf3e5c8774eed23"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11101046573/zip" > /tmp/margin-attribution.zip
          unzip -q /tmp/margin-attribution.zip -d .cache/margin-attribution
          test -f .cache/margin-attribution/v15n_d6_d2_d3_d3_d4_d2_d1_d1_d1_d1_d1_d1.json

      - name: Fetch frozen v15N candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740/zip" > /tmp/v15n.zip
          unzip -q /tmp/v15n.zip -d .cache/v15n-artifact
          test -f .cache/v15n-artifact/v15n_training.json

      - name: Fetch frozen v15E2 neural core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Run preregistered CAUSAL_MARGIN_DYNAMICS6
        env:
          V15N_D6_D2_D3_D3_D4_D2_D1_D1_D1_D1_D1_D1_ARTIFACT_FILE: .cache/margin-attribution/v15n_d6_d2_d3_d3_d4_d2_d1_d1_d1_d1_d1_d1.json
          V15N_ARTIFACT_FILE: .cache/v15n-artifact/v15n_training.json
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-d1-d1-causal-margin-dynamics6.mjs

      - name: Upload DYNAMICS6 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-d1-d1-${{ github.run_id }}
          path: results/v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-d1-d1-causal-margin-dynamics6
          if-no-files-found: warn
          retention-days: 30
