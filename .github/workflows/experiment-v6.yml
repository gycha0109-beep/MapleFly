name: Run MapleFly Experiment v6 Learning Readiness

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Number of deterministic seeds"
        required: true
        default: "4"
      seed:
        description: "Base seed"
        required: true
        default: "64"
      levels:
        description: "Comma-separated KC tonic bias sweep"
        required: true
        default: "0,-0.24,-0.26,-0.28,-0.29,-0.30,-0.31,-0.32,-0.34"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/experiment-v6.yml"
      - "scripts/experiment-v6-learning-readiness.mjs"
      - "src/headless/connectome-runtime.mjs"

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      EXP_SEEDS: ${{ github.event_name == 'workflow_dispatch' && inputs.seeds || '2' }}
      EXP_SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.seed || '64' }}
      EXP_LEVELS: ${{ github.event_name == 'workflow_dispatch' && inputs.levels || '0,-0.24,-0.26,-0.28,-0.29,-0.30,-0.31,-0.32,-0.34' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: |
          node --check src/headless/connectome-runtime.mjs
          node --check scripts/experiment-v6-learning-readiness.mjs

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Run learning-readiness assay
        run: >
          node scripts/experiment-v6-learning-readiness.mjs
          --seeds "$EXP_SEEDS"
          --seed "$EXP_SEED"
          --levels "$EXP_LEVELS"
          --out results/experiment-v6
          --cache .cache/maplefly-connectome

      - name: Upload experiment results
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-experiment-v6-${{ github.run_id }}
          path: results/experiment-v6
          if-no-files-found: error
          retention-days: 30
