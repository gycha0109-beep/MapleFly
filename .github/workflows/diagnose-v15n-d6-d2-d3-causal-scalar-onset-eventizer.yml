name: Diagnose MapleFly v15N-D6-D2-D3 Causal Scalar Onset Eventizer

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/diagnose-v15n-d6-d2-d3-causal-scalar-onset-eventizer.mjs"
      - "history/prereg_v15n_d6_d2_d3.md"
      - ".github/workflows/diagnose-v15n-d6-d2-d3-causal-scalar-onset-eventizer.yml"

permissions:
  contents: read
  actions: read

jobs:
  causal-eventizer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: node --check scripts/diagnose-v15n-d6-d2-d3-causal-scalar-onset-eventizer.mjs
      - name: Verify frozen v15N-D6-D2-D3 contract
        run: |
          set -euo pipefail
          grep -q 'f4259d5ea071d0bb1686e78ce1b2e3c2d863b539' scripts/diagnose-v15n-d6-d2-d3-causal-scalar-onset-eventizer.mjs
          grep -q '51bcb6fbc61e568b6f515660325c45127a9a4f51cf9fe19086abc78b3b3c496d' scripts/diagnose-v15n-d6-d2-d3-causal-scalar-onset-eventizer.mjs
          grep -q 'V15N_D6_D2_D3_HOLDOUT_BASE_SEEDS = \[4471000, 4481000, 4491000\]' scripts/diagnose-v15n-d6-d2-d3-causal-scalar-onset-eventizer.mjs
          grep -q 'V15N_D6_D2_D3_EVENT_GATE = 0.75' scripts/diagnose-v15n-d6-d2-d3-causal-scalar-onset-eventizer.mjs
          grep -q 'refractoryFrames: 0' scripts/diagnose-v15n-d6-d2-d3-causal-scalar-onset-eventizer.mjs
      - name: Fetch authoritative v15N-D6-D2-D2 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-d6-d2-d2-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10893084661" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10893084661" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:9873b523751ac109596b70d96d2bbde264ae0a92d2df8abebcce99d9e983b8fe"
          test "$head_sha" = "24d8a9a175a63cb04962fde3e16058895f15644c"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10893084661/zip" > /tmp/v15n-d6-d2-d2.zip
          unzip -q /tmp/v15n-d6-d2-d2.zip -d .cache/v15n-d6-d2-d2-artifact
          test -f .cache/v15n-d6-d2-d2-artifact/v15n_d6_d2_d2.json
          echo "51bcb6fbc61e568b6f515660325c45127a9a4f51cf9fe19086abc78b3b3c496d  .cache/v15n-d6-d2-d2-artifact/v15n_d6_d2_d2.json" | sha256sum -c -
      - name: Fetch frozen v15N candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:2a4492b371eaaaccaf12cbb29f5062708833e722d0af111a50e7cd0112abf6e2"
          test "$head_sha" = "d3e434fc5a9f9a8b9e83d96637b25e2058398274"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740/zip" > /tmp/v15n.zip
          unzip -q /tmp/v15n.zip -d .cache/v15n-artifact
          test -f .cache/v15n-artifact/v15n_training.json
          echo "103e3ebc84e7d062394ec22608b533cfc135c89eedc766f7f7c682a6dcdcd1a4  .cache/v15n-artifact/v15n_training.json" | sha256sum -c -
      - name: Fetch frozen v15E2 neural core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:a119bc0e425d08c5ce2381e6054c6ee358bf9402d5c442a57c00c916fd3b9405"
          test "$head_sha" = "a04fc64f159079a3e51d6e7ed3663fce25cb83bc"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json
      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e
      - name: Run preregistered v15N-D6-D2-D3 causal scalar-onset eventizer audit
        env:
          V15N_D6_D2_D2_ARTIFACT_FILE: .cache/v15n-d6-d2-d2-artifact/v15n_d6_d2_d2.json
          V15N_ARTIFACT_FILE: .cache/v15n-artifact/v15n_training.json
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/diagnose-v15n-d6-d2-d3-causal-scalar-onset-eventizer.mjs
      - name: Upload v15N-D6-D2-D3 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15n-d6-d2-d3-causal-scalar-onset-eventizer-${{ github.run_id }}
          path: results/v15n-d6-d2-d3-causal-scalar-onset-eventizer
          if-no-files-found: warn
          retention-days: 30
