name: Diagnose MapleFly v15N-D6-D2-D3-D2 Conditional Re-impact Innovation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/diagnose-v15n-d6-d2-d3-d2-conditional-reimpact-innovation-observability.mjs"
      - "history/prereg_v15n_d6_d2_d3_d2.md"
      - ".github/workflows/diagnose-v15n-d6-d2-d3-d2-conditional-reimpact-innovation-observability.yml"

permissions:
  contents: read
  actions: read

jobs:
  conditional-reimpact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: node --check scripts/diagnose-v15n-d6-d2-d3-d2-conditional-reimpact-innovation-observability.mjs
      - name: Verify frozen v15N-D6-D2-D3-D2 contract
        run: |
          set -euo pipefail
          grep -q 'c62c85ac624e5d13e66b7be2b015ce4c9fbb4d81' scripts/diagnose-v15n-d6-d2-d3-d2-conditional-reimpact-innovation-observability.mjs
          grep -q '4ee2b5acf8feb8ad04f72018afcad953dc7b2584102ee0d335eb3867cb711e16' scripts/diagnose-v15n-d6-d2-d3-d2-conditional-reimpact-innovation-observability.mjs
          grep -q 'V15N_D6_D2_D3_D2_HOLDOUT_BASE_SEEDS = \[4511000, 4521000, 4531000\]' scripts/diagnose-v15n-d6-d2-d3-d2-conditional-reimpact-innovation-observability.mjs
          grep -q 'V15N_D6_D2_D3_D2_GATE = 0.75' scripts/diagnose-v15n-d6-d2-d3-d2-conditional-reimpact-innovation-observability.mjs
          grep -q 'replacementEventizerEvaluated: false' scripts/diagnose-v15n-d6-d2-d3-d2-conditional-reimpact-innovation-observability.mjs
      - name: Fetch authoritative v15N-D6-D2-D3-D1 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-d6-d2-d3-d1-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10896464244" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10896464244" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:2b2a84623b5312175d59b4472658979341ae29d771024f49819a8b8668553c60"
          test "$head_sha" = "41be7be00aaa638a75666d670d673249f1758d01"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10896464244/zip" > /tmp/v15n-d6-d2-d3-d1.zip
          unzip -q /tmp/v15n-d6-d2-d3-d1.zip -d .cache/v15n-d6-d2-d3-d1-artifact
          test -f .cache/v15n-d6-d2-d3-d1-artifact/v15n_d6_d2_d3_d1.json
          echo "4ee2b5acf8feb8ad04f72018afcad953dc7b2584102ee0d335eb3867cb711e16  .cache/v15n-d6-d2-d3-d1-artifact/v15n_d6_d2_d3_d1.json" | sha256sum -c -
      - name: Fetch frozen v15N candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:2a4492b371eaaaccaf12cbb29f5062708833e722d0af111a50e7cd0112abf6e2"
          test "$head_sha" = "d3e434fc5a9f9a8b9e83d96637b25e2058398274"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740/zip" > /tmp/v15n.zip
          unzip -q /tmp/v15n.zip -d .cache/v15n-artifact
          test -f .cache/v15n-artifact/v15n_training.json
          echo "103e3ebc84e7d062394ec22608b533cfc135c89eedc766f7f7c682a6dcdcd1a4  .cache/v15n-artifact/v15n_training.json" | sha256sum -c -
      - name: Fetch frozen v15E2 neural core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:a119bc0e425d08c5ce2381e6054c6ee358bf9402d5c442a57c00c916fd3b9405"
          test "$head_sha" = "a04fc64f159079a3e51d6e7ed3663fce25cb83bc"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json
      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e
      - name: Run preregistered v15N-D6-D2-D3-D2 conditional re-impact innovation audit
        env:
          V15N_D6_D2_D3_D1_ARTIFACT_FILE: .cache/v15n-d6-d2-d3-d1-artifact/v15n_d6_d2_d3_d1.json
          V15N_ARTIFACT_FILE: .cache/v15n-artifact/v15n_training.json
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/diagnose-v15n-d6-d2-d3-d2-conditional-reimpact-innovation-observability.mjs
      - name: Upload v15N-D6-D2-D3-D2 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15n-d6-d2-d3-d2-conditional-reimpact-${{ github.run_id }}
          path: results/v15n-d6-d2-d3-d2-conditional-reimpact-innovation-observability
          if-no-files-found: warn
          retention-days: 30
