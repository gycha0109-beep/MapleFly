name: Evaluate MapleFly v16B Continuous Ecology

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/evaluate-v16b-continuous-ecology.mjs"
      - "history/prereg_v16b.md"
      - ".github/workflows/evaluate-v16b-continuous-ecology.yml"

permissions:
  contents: read

jobs:
  frozen-continuous-ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: node --check scripts/evaluate-v16b-continuous-ecology.mjs
      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e
      - name: Run preregistered v16B continuous ecology
        run: node scripts/evaluate-v16b-continuous-ecology.mjs
      - name: Upload v16B evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v16b-continuous-ecology-${{ github.run_id }}
          path: results/v16b-continuous-ecology
          if-no-files-found: warn
          retention-days: 30
