name: Run MapleFly v11 JUMP Learning Experiment

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/experiment-v11g4-reward-advantage.yml"

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/experiment-v11g5-paired-counterfactual.mjs

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Run v11G5 paired counterfactual evaluation
        run: node scripts/experiment-v11g5-paired-counterfactual.mjs

      - name: Upload experiment result
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v11g5-paired-counterfactual-${{ github.run_id }}
          path: results/experiment-v11g5
          if-no-files-found: error
          retention-days: 30

      - name: Build auditable run receipt
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(
            fs.readFileSync(
              "results/experiment-v11g5/experiment_v11g5.json",
              "utf8"
            )
          );
          const receipt = {
            schema: "maplefly.v11g5-run-receipt.1",
            runId: Number(process.env.GITHUB_RUN_ID),
            headSha: process.env.GITHUB_SHA,
            artifact: {
              id: process.env.ARTIFACT_ID
                ? Number(process.env.ARTIFACT_ID)
                : null,
              name:
                "maplefly-v11g5-paired-counterfactual-" +
                process.env.GITHUB_RUN_ID,
              digest:
                process.env.ARTIFACT_DIGEST || null
            },
            meta: result.meta,
            practice: result.practice,
            candidate: result.candidate || null,
            summary: result.summary,
            perRun: result.perRun
          };
          fs.mkdirSync(
            "history/run_receipts",
            { recursive: true }
          );
          fs.writeFileSync(
            "history/run_receipts/v11g5_latest.json",
            JSON.stringify(receipt, null, 2) + "\n"
          );
          NODE

      - name: Commit run receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/run_receipts/v11g5_latest.json
          git commit -m "ci(results): record v11G5 run ${GITHUB_RUN_ID}" || exit 0
          git push

      - name: Enforce technical workflow success
        run: |
          test -f results/experiment-v11g5/experiment_v11g5.json
          echo "v11G5 artifact and receipt path verified"
