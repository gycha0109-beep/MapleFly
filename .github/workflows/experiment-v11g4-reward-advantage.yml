name: Run MapleFly v11 JUMP Learning Experiment

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/experiment-v11g4-reward-advantage.yml"

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/experiment-v11h0-orthogonal-looming-screen.mjs

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Run v11H0 orthogonal looming screen
        run: node scripts/experiment-v11h0-orthogonal-looming-screen.mjs

      - name: Upload experiment result
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v11h0-orthogonal-looming-${{ github.run_id }}
          path: results/experiment-v11h0
          if-no-files-found: error
          retention-days: 30

      - name: Build auditable run receipt
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(
            fs.readFileSync(
              "results/experiment-v11h0/experiment_v11h0.json",
              "utf8"
            )
          );
          const receipt = {
            schema: "maplefly.v11h0-run-receipt.1",
            runId: Number(process.env.GITHUB_RUN_ID),
            headSha: process.env.GITHUB_SHA,
            artifact: {
              id: process.env.ARTIFACT_ID
                ? Number(process.env.ARTIFACT_ID)
                : null,
              name:
                "maplefly-v11h0-orthogonal-looming-" +
                process.env.GITHUB_RUN_ID,
              digest:
                process.env.ARTIFACT_DIGEST || null
            },
            meta: result.meta,
            results: result.results,
            selectedRepresentation: result.selectedRepresentation,
            currentFullBalancedAccuracy: result.currentFullBalancedAccuracy,
            selectedHistoryGain: result.selectedHistoryGain,
            gate: result.gate
          };
          fs.mkdirSync(
            "history/run_receipts",
            { recursive: true }
          );
          fs.writeFileSync(
            "history/run_receipts/v11h0_latest.json",
            JSON.stringify(receipt, null, 2) + "\n"
          );
          NODE

      - name: Commit run receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/run_receipts/v11h0_latest.json
          git commit -m "ci(results): record v11H0 run ${GITHUB_RUN_ID}" || exit 0
          git push

      - name: Enforce technical workflow success
        run: |
          test -f results/experiment-v11h0/experiment_v11h0.json
          echo "v11H0 artifact and receipt path verified"
