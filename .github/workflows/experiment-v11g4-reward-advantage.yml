name: Recover v11H0 Evidence Receipt

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/experiment-v11g4-reward-advantage.yml"

permissions:
  actions: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download authoritative H0 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/v11h0
          mkdir -p /tmp/v11h0
          gh run download 35745831597 \
            --repo "${GITHUB_REPOSITORY}" \
            --name "maplefly-v11h0-orthogonal-looming-35745831597" \
            --dir /tmp/v11h0
          test -f /tmp/v11h0/experiment_v11h0.json

      - name: Build authoritative receipt
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(
            fs.readFileSync(
              "/tmp/v11h0/experiment_v11h0.json",
              "utf8"
            )
          );
          const receipt = {
            schema: "maplefly.v11h0-run-receipt.1",
            runId: 35745831597,
            headSha:
              "8758ae57935c83452f193d22be194cf367f9f36b",
            artifact: {
              id: 10701519484,
              name:
                "maplefly-v11h0-orthogonal-looming-35745831597",
              digest:
                "sha256:dd125f1051c7ec7808be45ad9a574eb5d38eb8d9f1439ce40f874a1021f8ae42"
            },
            meta: result.meta,
            results: result.results,
            selectedRepresentation:
              result.selectedRepresentation,
            currentFullBalancedAccuracy:
              result.currentFullBalancedAccuracy,
            selectedHistoryGain:
              result.selectedHistoryGain,
            gate: result.gate,
            technicalNote:
              "authoritative experiment and artifact succeeded; original workflow failed only at receipt git push"
          };
          fs.mkdirSync(
            "history/run_receipts",
            { recursive: true }
          );
          fs.writeFileSync(
            "history/run_receipts/v11h0_latest.json",
            JSON.stringify(receipt, null, 2) + "\n"
          );
          NODE

      - name: Commit recovered receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/run_receipts/v11h0_latest.json
          git commit -m "ci(results): recover v11H0 run 35745831597" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify recovery
        run: |
          test -f history/run_receipts/v11h0_latest.json
          echo "V11H0-RECEIPT-RECOVERY=PASS"
