name: Diagnose MapleFly v15N-D6-D2-D3-D3-D4-D2-D1-D1-D1 Three-Class TEMPORAL3

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-three-class-temporal3.mjs"
      - "history/prereg_v15n_d6_d2_d3_d3_d4_d2_d1_d1_d1.md"
      - ".github/workflows/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-three-class-temporal3.yml"

permissions:
  contents: read
  actions: read

jobs:
  three-class-temporal3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-three-class-temporal3.mjs

      - name: Verify frozen three-class contract
        run: |
          set -euo pipefail
          f="scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-three-class-temporal3.mjs"
          grep -q '1dcc276e934ad99432938179e9ec5c35096ecca8' "$f"
          grep -q '8e100496082be0c38bf66f24b1b0fdfe5e0115486831e7c38fa094a12a404fc9' "$f"
          grep -q '5631000, 5641000, 5651000, 5661000' "$f"
          grep -q '5721000, 5731000, 5741000, 5751000' "$f"
          grep -q 'thresholdTuned: false' "$f"
          grep -q 'runtimeThresholdChanged: false' "$f"
          grep -q 'temporalDepthTuned: false' "$f"
          grep -q 'refractoryTuned: false' "$f"

      - name: Fetch authoritative scalar-audit evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/scalar-audit
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11018846070" --jq '.workflow_run.head_sha')"
          test "$head_sha" = "79e2b1d20926e27db6eb846216f9a870403a0ee8"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11018846070/zip" > /tmp/scalar.zip
          unzip -q /tmp/scalar.zip -d .cache/scalar-audit
          test -f .cache/scalar-audit/v15n_d6_d2_d3_d3_d4_d2_d1_d1.json

      - name: Fetch authoritative D4-D2 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/d4d2-artifact
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11011816687" --jq '.workflow_run.head_sha')"
          test "$head_sha" = "45298bb59896472d65b06e2e091ac66c83bb7fa1"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11011816687/zip" > /tmp/d4d2.zip
          unzip -q /tmp/d4d2.zip -d .cache/d4d2-artifact
          test -f .cache/d4d2-artifact/v15n_d6_d2_d3_d3_d4_d2.json

      - name: Fetch frozen v15N candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740/zip" > /tmp/v15n.zip
          unzip -q /tmp/v15n.zip -d .cache/v15n-artifact
          test -f .cache/v15n-artifact/v15n_training.json

      - name: Fetch frozen v15E2 neural core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Run preregistered three-class TEMPORAL3
        env:
          V15N_D6_D2_D3_D3_D4_D2_D1_D1_ARTIFACT_FILE: .cache/scalar-audit/v15n_d6_d2_d3_d3_d4_d2_d1_d1.json
          V15N_D6_D2_D3_D3_D4_D2_ARTIFACT_FILE: .cache/d4d2-artifact/v15n_d6_d2_d3_d3_d4_d2.json
          V15N_ARTIFACT_FILE: .cache/v15n-artifact/v15n_training.json
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-three-class-temporal3.mjs

      - name: Upload three-class evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-${{ github.run_id }}
          path: results/v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-three-class-temporal3
          if-no-files-found: warn
          retention-days: 30
