name: Run MapleFly Experiment v10C Current DN Outcome

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Independent practice/train runs"
        required: true
        default: "3"
      train:
        description: "Practice episodes per run (multiple of 4 stages)"
        required: true
        default: "96"
      eval:
        description: "Held-out evaluation episodes per condition"
        required: true
        default: "32"
      seed:
        description: "Base seed"
        required: true
        default: "64"
      max_seconds:
        description: "Max seconds per episode"
        required: true
        default: "4.5"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/experiment-v10c-current-outcome.yml"
      - "scripts/experiment-v10c-current-outcome.mjs"
      - "src/brain/fly-skill-v7.js"
      - "src/headless/connectome-runtime.mjs"

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      EXP_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.runs || '2' }}
      EXP_TRAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.train || '64' }}
      EXP_EVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.eval || '24' }}
      EXP_SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.seed || '64' }}
      EXP_MAX_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_seconds || '4.5' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/experiment-v10c-current-outcome.mjs

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Run current-DN outcome tutorial
        run: >
          node scripts/experiment-v10c-current-outcome.mjs
          --runs "$EXP_RUNS"
          --train "$EXP_TRAIN"
          --eval "$EXP_EVAL"
          --seed "$EXP_SEED"
          --max-seconds "$EXP_MAX_SECONDS"
          --out results/experiment-v10c
          --cache .cache/maplefly-connectome

      - name: Upload experiment results
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-experiment-v10c-${{ github.run_id }}
          path: results/experiment-v10c
          if-no-files-found: error
          retention-days: 30
