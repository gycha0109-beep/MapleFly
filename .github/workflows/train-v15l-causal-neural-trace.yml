# v15L preregistered execution
name: Train MapleFly v15L Causal Neural Trace

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/train-v15l-causal-neural-trace.mjs"
      - "history/prereg_v15l.md"
      - ".github/workflows/train-v15l-causal-neural-trace.yml"

permissions:
  contents: read
  actions: read

jobs:
  causal-neural-trace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: node --check scripts/train-v15l-causal-neural-trace.mjs
      - name: Verify frozen preregistration contract
        run: |
          set -euo pipefail
          grep -q '613143b63fd4149015d6b0b2a3f435bfb3362573' scripts/train-v15l-causal-neural-trace.mjs
          grep -q 'const V15L_TRACE_DECAY = 0.9659363289248456;' scripts/train-v15l-causal-neural-trace.mjs
          grep -q 'const V15L_PCA_COMPONENTS = 32;' scripts/train-v15l-causal-neural-trace.mjs
          grep -q 'const V15L_POLICY_PARAMS = 37;' scripts/train-v15l-causal-neural-trace.mjs
          grep -q 'const V15L_CEM_SEED = 3858000;' scripts/train-v15l-causal-neural-trace.mjs
          grep -q 'const V15L_TRAIN_BASE_SEEDS = \[3751000, 3761000, 3771000\];' scripts/train-v15l-causal-neural-trace.mjs
          grep -q 'const V15L_EVAL_BASE_SEEDS = \[3781000, 3791000, 3801000\];' scripts/train-v15l-causal-neural-trace.mjs
          ! grep -q 'current_and_previous_9_frozen_v15e2_margins' scripts/train-v15l-causal-neural-trace.mjs
          ! grep -q 'function tapeMargins(' scripts/train-v15l-causal-neural-trace.mjs
      - name: Fetch frozen v15E2 neural core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:a119bc0e425d08c5ce2381e6054c6ee358bf9402d5c442a57c00c916fd3b9405"
          test "$head_sha" = "a04fc64f159079a3e51d6e7ed3663fce25cb83bc"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json
      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e
      - name: Run preregistered v15L causal neural trace remediation
        env:
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/train-v15l-causal-neural-trace.mjs
      - name: Upload v15L evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15l-causal-neural-trace-${{ github.run_id }}
          path: results/v15l-causal-neural-trace-remediation
          if-no-files-found: warn
          retention-days: 30
