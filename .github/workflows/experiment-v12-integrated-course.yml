name: Run MapleFly v12 Integrated Course

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/experiment-v12-integrated-course.mjs"
      - ".github/workflows/experiment-v12-integrated-course.yml"

permissions:
  contents: read

jobs:
  integrated-course:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/experiment-v12-integrated-course.mjs

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Run pre-registered three-skill integrated course
        run: node scripts/experiment-v12-integrated-course.mjs

      - name: Upload v12 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v12-integrated-course-${{ github.run_id }}
          path: results/experiment-v12-integrated-course
          if-no-files-found: warn
          retention-days: 30
