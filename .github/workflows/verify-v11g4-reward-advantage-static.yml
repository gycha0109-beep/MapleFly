name: Verify v11 JUMP Learning Static

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-v11g4-reward-advantage-static.yml"
      - "scripts/experiment-v11h1-broad-obstacle-screen.mjs"
      - "history/prereg_v11h1.md"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: node --check scripts/experiment-v11h1-broad-obstacle-screen.mjs
      - name: Verify H1 contract
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const s = fs.readFileSync(
            "scripts/experiment-v11h1-broad-obstacle-screen.mjs",
            "utf8"
          );
          const required = [
            "2101000","2101100","2101200","2101300",
            "2111000","2111100","2111200",
            "\"LC6\"","\"LC16\"","\"LC12\"","\"LC15\"",
            "fullMean >= 0.85",
            "minRun >= 0.75",
            "fullMean - shuffledMean >= 0.25",
            "fullMean - permutedMean >= 0.25",
            "V11H1-CONTEXT-GATE="
          ];
          for (const token of required) {
            if (!s.includes(token)) {
              throw new Error("missing H1 contract: " + token);
            }
          }
          const encoder = s.slice(
            s.indexOf("class BroadObstacleEncoder"),
            s.indexOf("function makeContextEpisode")
          );
          const obstaclePart = encoder.slice(
            encoder.indexOf("if (obstacle)")
          );
          if (obstaclePart.includes("\"LC4_\" + obstacle.side")) {
            throw new Error("obstacle still drives LC4");
          }
          if (!encoder.includes("\"LC4_\" + side")) {
            throw new Error("target LC4 not preserved");
          }
          console.log(
            "V11H1-STATIC=PASS input=CURRENT_DN obstacle=LC6+LC16+LC12+LC15 targetLC4=preserved"
          );
          NODE
