name: Verify v11 JUMP Learning Static

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-v11g4-reward-advantage-static.yml"
      - "scripts/experiment-v11g5-paired-counterfactual.mjs"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/experiment-v11g5-paired-counterfactual.mjs

      - name: Verify preregistered G5 contract
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const s = fs.readFileSync(
            "scripts/experiment-v11g5-paired-counterfactual.mjs",
            "utf8"
          );

          const required = [
            "1901000",
            "1911000",
            "1921000",
            "1951000",
            "1961000",
            "1971000",
            "jumpResult.reward -",
            "waitResult.reward",
            "featureDifference >",
            "1e-9",
            "TRAIN_EPOCHS = 400",
            "TRAIN_LEARNING_RATE = 0.01",
            "TRAIN_L2 = 0.001",
            "SELECTED_FEATURE_COUNT = 256",
            "TEMPORAL_WINDOWS = 4",
            "PERSISTENCE_WINDOWS = 2",
            "advantage > 0",
            "support.validPairs >= 270",
            "support.positiveDelta >= 24",
            "support.negativeDelta >= 24",
            "meanFull >= 0.75",
            "minFull >= 0.65",
            "meanFull - meanOff >= 0.25",
            "meanTimeout <= 0.20",
            "meanJumps <= 1.75",
            "targetReach >= 0.85",
            "targetJump <= 0.30",
            "V11G5-JUMP-GATE="
          ];

          for (const token of required) {
            if (!s.includes(token)) {
              throw new Error(
                "missing G5 contract: " + token
              );
            }
          }

          const policyInputBlock = s.slice(
            s.indexOf("class RewardAdvantagePolicy"),
            s.indexOf("async function runPolicyEpisode")
          );

          for (const forbidden of [
            "targetX",
            "obstacle",
            "startDistance",
            "withObstacle",
            "firstJumpFrontDistance",
            "terminalStatus",
            "deltaReward",
            "reward"
          ]) {
            if (policyInputBlock.includes(forbidden)) {
              throw new Error(
                "policy leak token: " + forbidden
              );
            }
          }

          console.log(
            "V11G5-STATIC=PASS representation=CONCAT4 selected=256 target=paired-deltaR boundary=0 persistence=2"
          );
          NODE
