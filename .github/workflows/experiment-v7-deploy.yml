name: Verify MapleFly v7 Deploy Skill

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "Balanced episodes per distance / condition"
        required: true
        default: "80"
      seed:
        description: "Base seed"
        required: true
        default: "9000"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/experiment-v7-deploy.yml"
      - "scripts/experiment-v7-deploy-check.mjs"
      - "src/brain/fly-skill-v7.js"
      - "src/brain/fly-worker.js"
      - "src/brain/fly-controller.js"
      - "src/game.js"
      - "index.html"
      - "src/headless/connectome-runtime.mjs"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      EXP_EPISODES: ${{ github.event_name == 'workflow_dispatch' && inputs.episodes || '40' }}
      EXP_SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.seed || '9000' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: |
          node --check src/brain/fly-skill-v7.js
          node --check src/brain/fly-worker.js
          node --check src/brain/fly-controller.js
          node --check src/game.js
          node --check scripts/experiment-v7-deploy-check.mjs

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Verify sparse deployment skill
        run: >
          node scripts/experiment-v7-deploy-check.mjs
          --episodes "$EXP_EPISODES"
          --seed "$EXP_SEED"
          --out results/experiment-v7-deploy
          --cache .cache/maplefly-connectome

      - name: Upload verification result
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v7-deploy-${{ github.run_id }}
          path: results/experiment-v7-deploy
          if-no-files-found: error
          retention-days: 30
