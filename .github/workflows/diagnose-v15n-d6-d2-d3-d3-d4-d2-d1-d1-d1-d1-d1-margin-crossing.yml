name: Diagnose MapleFly v15N-D6-D2-D3-D3-D4-D2-D1-D1-D1-D1-D1 Margin Crossing

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-train-calibrated-margin-crossing.mjs"
      - "history/prereg_v15n_d6_d2_d3_d3_d4_d2_d1_d1_d1_d1_d1.md"
      - ".github/workflows/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-margin-crossing.yml"

permissions:
  contents: read
  actions: read

jobs:
  margin-crossing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-train-calibrated-margin-crossing.mjs

      - name: Verify frozen margin-crossing contract
        run: |
          set -euo pipefail
          f="scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-train-calibrated-margin-crossing.mjs"
          grep -q 'f0516f629d946871cdf37336cd921eca6287d525' "$f"
          grep -q 'a39781bedc4cb67da602c758a09b942b5a98b622a1aa9902123b9b0fda410024' "$f"
          grep -q '5811000, 5821000, 5831000, 5841000' "$f"
          grep -q '5901000, 5911000, 5921000, 5931000' "$f"
          grep -q '5991000, 6001000, 6011000, 6021000' "$f"
          grep -q 'thresholdTunedOnProspective: false' "$f"
          grep -q 'temporalDepthTuned: false' "$f"
          grep -q 'refractoryTuned: false' "$f"

      - name: Fetch authoritative failure-attribution evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/failure-attribution
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11078026076" --jq '.workflow_run.head_sha')"
          test "$head_sha" = "75a8e881bf5dee5272d9ef8ed21cb96ad889dbe7"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11078026076/zip" > /tmp/failure-attribution.zip
          unzip -q /tmp/failure-attribution.zip -d .cache/failure-attribution
          test -f .cache/failure-attribution/v15n_d6_d2_d3_d3_d4_d2_d1_d1_d1_d1.json

      - name: Fetch frozen v15N candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740/zip" > /tmp/v15n.zip
          unzip -q /tmp/v15n.zip -d .cache/v15n-artifact
          test -f .cache/v15n-artifact/v15n_training.json

      - name: Fetch frozen v15E2 neural core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Run preregistered train-calibrated margin crossing
        env:
          V15N_D6_D2_D3_D3_D4_D2_D1_D1_D1_D1_ARTIFACT_FILE: .cache/failure-attribution/v15n_d6_d2_d3_d3_d4_d2_d1_d1_d1_d1.json
          V15N_ARTIFACT_FILE: .cache/v15n-artifact/v15n_training.json
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/diagnose-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-train-calibrated-margin-crossing.mjs

      - name: Upload margin-crossing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-${{ github.run_id }}
          path: results/v15n-d6-d2-d3-d3-d4-d2-d1-d1-d1-d1-d1-train-calibrated-margin-crossing
          if-no-files-found: warn
          retention-days: 30
