name: Diagnose MapleFly v15N-D6-D2-D1 Event Timing Lockout

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/diagnose-v15n-d6-d2-d1-event-timing-lockout.mjs"
      - "history/prereg_v15n_d6_d2_d1.md"
      - ".github/workflows/diagnose-v15n-d6-d2-d1-event-timing-lockout.yml"

permissions:
  contents: read
  actions: read

jobs:
  event-timing-lockout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: node --check scripts/diagnose-v15n-d6-d2-d1-event-timing-lockout.mjs
      - name: Verify frozen v15N-D6-D2-D1 contract
        run: |
          set -euo pipefail
          grep -q '43a96d18c2f399ebac03dff7eb70546e19cc94dc' scripts/diagnose-v15n-d6-d2-d1-event-timing-lockout.mjs
          grep -q '475d612723d48f89224bedbde903431235f0ae4555d38742ccaaaa7dae81f2a5' scripts/diagnose-v15n-d6-d2-d1-event-timing-lockout.mjs
          grep -q 'V15N_D6_D2_D1_ATTRIBUTION_GATE = 0.60' scripts/diagnose-v15n-d6-d2-d1-event-timing-lockout.mjs
          grep -q 'V15N_D6_D2_D1_LINGER_RETRIGGER_AND_LOCKOUT' scripts/diagnose-v15n-d6-d2-d1-event-timing-lockout.mjs
          grep -q 'alternativeEventizerEvaluated: false' scripts/diagnose-v15n-d6-d2-d1-event-timing-lockout.mjs
      - name: Fetch authoritative v15N-D6-D2 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-d6-d2-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10891293918" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10891293918" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:377027609d0e87aeb50dea973c6871a67f7eeb421edef7cbf64bb14797b495ba"
          test "$head_sha" = "b987e972f8fef623c374c8b5752a891a3d6409d4"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10891293918/zip" > /tmp/v15n-d6-d2.zip
          unzip -q /tmp/v15n-d6-d2.zip -d .cache/v15n-d6-d2-artifact
          test -f .cache/v15n-d6-d2-artifact/v15n_d6_d2.json
          echo "475d612723d48f89224bedbde903431235f0ae4555d38742ccaaaa7dae81f2a5  .cache/v15n-d6-d2-artifact/v15n_d6_d2.json" | sha256sum -c -
      - name: Fetch frozen v15N candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:2a4492b371eaaaccaf12cbb29f5062708833e722d0af111a50e7cd0112abf6e2"
          test "$head_sha" = "d3e434fc5a9f9a8b9e83d96637b25e2058398274"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740/zip" > /tmp/v15n.zip
          unzip -q /tmp/v15n.zip -d .cache/v15n-artifact
          test -f .cache/v15n-artifact/v15n_training.json
          echo "103e3ebc84e7d062394ec22608b533cfc135c89eedc766f7f7c682a6dcdcd1a4  .cache/v15n-artifact/v15n_training.json" | sha256sum -c -
      - name: Fetch frozen v15E2 neural core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:a119bc0e425d08c5ce2381e6054c6ee358bf9402d5c442a57c00c916fd3b9405"
          test "$head_sha" = "a04fc64f159079a3e51d6e7ed3663fce25cb83bc"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json
      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e
      - name: Run preregistered v15N-D6-D2-D1 timing and lockout attribution
        env:
          V15N_D6_D2_ARTIFACT_FILE: .cache/v15n-d6-d2-artifact/v15n_d6_d2.json
          V15N_ARTIFACT_FILE: .cache/v15n-artifact/v15n_training.json
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/diagnose-v15n-d6-d2-d1-event-timing-lockout.mjs
      - name: Upload v15N-D6-D2-D1 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15n-d6-d2-d1-event-timing-lockout-${{ github.run_id }}
          path: results/v15n-d6-d2-d1-event-timing-lockout
          if-no-files-found: warn
          retention-days: 30
