name: Verify v10F Browser ATTACK Deployment

on:
  pull_request:
    paths:
      - "index.html"
      - "src/brain/fly-worker.js"
      - "src/brain/fly-controller.js"
      - "src/brain/fly-skill-v10-attack.js"
      - "src/brain/fly-skill-v10f-candidate.json"
      - "scripts/verify-v10f-browser-equivalence.mjs"
      - ".github/workflows/verify-v10f-browser-deployment.yml"
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "src/brain/fly-worker.js"
      - "src/brain/fly-controller.js"
      - "src/brain/fly-skill-v10-attack.js"
      - "src/brain/fly-skill-v10f-candidate.json"
      - "scripts/verify-v10f-browser-equivalence.mjs"
      - ".github/workflows/verify-v10f-browser-deployment.yml"

permissions:
  contents: read

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check browser runtime
        run: |
          node --check src/brain/fly-worker.js
          node --check src/brain/fly-controller.js
          node --check src/brain/fly-skill-v10-attack.js
          node --check scripts/verify-v10f-browser-equivalence.mjs

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Verify exact browser/headless equivalence
        run: node scripts/verify-v10f-browser-equivalence.mjs

      - name: Upload equivalence evidence
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v10f-browser-equivalence-${{ github.run_id }}
          path: results/verify-v10f-browser
          if-no-files-found: error
          retention-days: 30
# v11H2 post-bundle ATTACK regression trigger: 35748844599
