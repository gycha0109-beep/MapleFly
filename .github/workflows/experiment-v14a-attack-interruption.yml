name: Run MapleFly v14A ATTACK Interruption

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/brain/fly-interruption-v14.js"
      - "scripts/experiment-v14a-attack-interruption.mjs"
      - ".github/workflows/experiment-v14a-attack-interruption.yml"

permissions:
  contents: read

jobs:
  attack-interruption:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: |
          node --check src/brain/fly-interruption-v14.js
          node --check scripts/experiment-v14a-attack-interruption.mjs

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Run preregistered v14A ATTACK interruption screen
        run: node scripts/experiment-v14a-attack-interruption.mjs

      - name: Upload v14A evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v14a-attack-interruption-${{ github.run_id }}
          path: results/experiment-v14a-attack-interruption
          if-no-files-found: warn
          retention-days: 30
