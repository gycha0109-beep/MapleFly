name: Diagnose MapleFly v15M-D3 Two-Timescale Action State

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/diagnose-v15m-d3-two-timescale-action-state.mjs"
      - "history/prereg_v15m_d3.md"
      - ".github/workflows/diagnose-v15m-d3-two-timescale-action-state.yml"

permissions:
  contents: read
  actions: read

jobs:
  two-timescale-action-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: node --check scripts/diagnose-v15m-d3-two-timescale-action-state.mjs
      - name: Verify frozen D3 contract
        run: |
          set -euo pipefail
          grep -q '412f08a5994bb6d6a0d7baca54a2096767b25383' scripts/diagnose-v15m-d3-two-timescale-action-state.mjs
          grep -q 'V15M_D3_BASE_SEEDS = \[4041000, 4051000, 4061000\]' scripts/diagnose-v15m-d3-two-timescale-action-state.mjs
          grep -q 'V15M_D3_INTERRUPTION_SEED = 4077000' scripts/diagnose-v15m-d3-two-timescale-action-state.mjs
          grep -q 'V15M_D3_SHORT_DECAY = 0.50' scripts/diagnose-v15m-d3-two-timescale-action-state.mjs
          grep -q 'V15M_D3_LONG_DECAY = 0.90' scripts/diagnose-v15m-d3-two-timescale-action-state.mjs
          grep -q 'V15M_D3_TWO_TIMESCALE_STATE_NOT_RULED_OUT' scripts/diagnose-v15m-d3-two-timescale-action-state.mjs
          grep -q 'replacementPolicyTrained: false' scripts/diagnose-v15m-d3-two-timescale-action-state.mjs
      - name: Fetch frozen v15E2 neural core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:a119bc0e425d08c5ce2381e6054c6ee358bf9402d5c442a57c00c916fd3b9405"
          test "$head_sha" = "a04fc64f159079a3e51d6e7ed3663fce25cb83bc"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json
      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e
      - name: Run preregistered v15M-D3 audit
        env:
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/diagnose-v15m-d3-two-timescale-action-state.mjs
      - name: Upload v15M-D3 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15m-d3-two-timescale-action-state-${{ github.run_id }}
          path: results/v15m-d3-two-timescale-action-state
          if-no-files-found: warn
          retention-days: 30
