name: Build v11H2 JUMP Browser Bundle

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-v11h2-jump-bundle.yml"
      - "scripts/build-v11h2-jump-bundle.mjs"
      - "scripts/verify-v11h2-jump-bundle-static.mjs"
      - "src/brain/fly-skill-v11h2-jump-candidate.json"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: |
          node --check scripts/build-v11h2-jump-bundle.mjs
          node --check scripts/verify-v11h2-jump-bundle-static.mjs

      - name: Build exact H2 browser bundle
        run: node scripts/build-v11h2-jump-bundle.mjs

      - name: Syntax check generated bundle
        run: node --check src/brain/fly-skill-v11h2-jump.js

      - name: Verify static exact equivalence
        run: node scripts/verify-v11h2-jump-bundle-static.mjs

      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/brain/fly-skill-v11h2-jump.js
          git commit -m "ci(learning): build v11H2 JUMP browser bundle" || exit 0
          git push
