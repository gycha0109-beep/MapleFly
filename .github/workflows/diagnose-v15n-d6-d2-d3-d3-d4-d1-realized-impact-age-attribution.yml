name: Diagnose MapleFly v15N-D6-D2-D3-D3-D4-D1 Realized Impact Age Attribution

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/diagnose-v15n-d6-d2-d3-d3-d4-d1-realized-impact-age-attribution.mjs"
      - "history/prereg_v15n_d6_d2_d3_d3_d4_d1.md"
      - ".github/workflows/diagnose-v15n-d6-d2-d3-d3-d4-d1-realized-impact-age-attribution.yml"

permissions:
  contents: read
  actions: read

jobs:
  realized-impact-age-attribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/diagnose-v15n-d6-d2-d3-d3-d4-d1-realized-impact-age-attribution.mjs

      - name: Verify frozen v15N-D6-D2-D3-D3-D4-D1 contract
        run: |
          set -euo pipefail
          grep -q 'a3f9a4074db6a1c3d92b3d3669bef99fae9d3a06' scripts/diagnose-v15n-d6-d2-d3-d3-d4-d1-realized-impact-age-attribution.mjs
          grep -q '154974f62c014a59a2f0fa2202081a17a9c39665e0c0db8fb879c75b4d232138' scripts/diagnose-v15n-d6-d2-d3-d3-d4-d1-realized-impact-age-attribution.mjs
          grep -q '63d7272e8c3fa25f114bb78f82ef840c882b86b8fbfdcc140750efe007afa784' scripts/diagnose-v15n-d6-d2-d3-d3-d4-d1-realized-impact-age-attribution.mjs
          grep -q '4cb231aaf0c0f19b89dbc26f202aa2e50890e56452f1971627389cf63a5791a1' scripts/diagnose-v15n-d6-d2-d3-d3-d4-d1-realized-impact-age-attribution.mjs
          grep -q 'temporalDepthTuned: false' scripts/diagnose-v15n-d6-d2-d3-d3-d4-d1-realized-impact-age-attribution.mjs

      - name: Fetch authoritative v15N-D6-D2-D3-D3-D4 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-d6-d2-d3-d3-d4-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11005414896" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11005414896" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:8b181324ed47f0253d31b3c582121b6fd3dc314df0ddfa9c94597910f930dff4"
          test "$head_sha" = "7922bb3bf9612e7e2649882400b9a6d0cddf7b14"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11005414896/zip" > /tmp/v15n-d6-d2-d3-d3-d4.zip
          unzip -q /tmp/v15n-d6-d2-d3-d3-d4.zip -d .cache/v15n-d6-d2-d3-d3-d4-artifact
          test -f .cache/v15n-d6-d2-d3-d3-d4-artifact/v15n_d6_d2_d3_d3_d4.json
          echo "154974f62c014a59a2f0fa2202081a17a9c39665e0c0db8fb879c75b4d232138  .cache/v15n-d6-d2-d3-d3-d4-artifact/v15n_d6_d2_d3_d3_d4.json" | sha256sum -c -

      - name: Fetch frozen v15N candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15n-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:2a4492b371eaaaccaf12cbb29f5062708833e722d0af111a50e7cd0112abf6e2"
          test "$head_sha" = "d3e434fc5a9f9a8b9e83d96637b25e2058398274"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10846125740/zip" > /tmp/v15n.zip
          unzip -q /tmp/v15n.zip -d .cache/v15n-artifact
          test -f .cache/v15n-artifact/v15n_training.json
          echo "103e3ebc84e7d062394ec22608b533cfc135c89eedc766f7f7c682a6dcdcd1a4  .cache/v15n-artifact/v15n_training.json" | sha256sum -c -

      - name: Fetch frozen v15E2 neural core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/v15e2-artifact
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.digest')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453" --jq '.workflow_run.head_sha')"
          test "$digest" = "sha256:a119bc0e425d08c5ce2381e6054c6ee358bf9402d5c442a57c00c916fd3b9405"
          test "$head_sha" = "a04fc64f159079a3e51d6e7ed3663fce25cb83bc"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10793265453/zip" > /tmp/v15e2.zip
          unzip -q /tmp/v15e2.zip -d .cache/v15e2-artifact
          test -f .cache/v15e2-artifact/v15e2_training.json

      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

      - name: Run preregistered v15N-D6-D2-D3-D3-D4-D1 age attribution
        env:
          V15N_D6_D2_D3_D3_D4_ARTIFACT_FILE: .cache/v15n-d6-d2-d3-d3-d4-artifact/v15n_d6_d2_d3_d3_d4.json
          V15N_ARTIFACT_FILE: .cache/v15n-artifact/v15n_training.json
          V15E2_ARTIFACT_FILE: .cache/v15e2-artifact/v15e2_training.json
        run: node scripts/diagnose-v15n-d6-d2-d3-d3-d4-d1-realized-impact-age-attribution.mjs

      - name: Upload v15N-D6-D2-D3-D3-D4-D1 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15n-d6-d2-d3-d3-d4-d1-age-attribution-${{ github.run_id }}
          path: results/v15n-d6-d2-d3-d3-d4-d1-realized-impact-age-attribution
          if-no-files-found: warn
          retention-days: 30
