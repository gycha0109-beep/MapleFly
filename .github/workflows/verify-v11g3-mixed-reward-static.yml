name: Verify v11G3 Mixed Reward Static

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-v11g3-mixed-reward-static.yml"
      - "scripts/experiment-v11g3-mixed-reward-jump.mjs"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/experiment-v11g3-mixed-reward-jump.mjs

      - name: Verify frozen scientific contract
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const s = fs.readFileSync(
            "scripts/experiment-v11g3-mixed-reward-jump.mjs",
            "utf8"
          );

          const required = [
            "const TEMPORAL_WINDOWS = 4",
            "const SELECTED_FEATURE_COUNT = 256",
            "const INTERVENTION_MAX_WINDOW = 14",
            "const POLICY_THRESHOLD = 0.5",
            "const PERSISTENCE_WINDOWS = 2",
            "const TRAIN_EPOCHS = 300",
            "const TRAIN_LEARNING_RATE = 0.03",
            "const TRAIN_L2 = 0.001",
            "1601000",
            "1611000",
            "1621000",
            "1651000",
            "1661000",
            "1671000",
            "support.WAIT.positive >= 24",
            "support.WAIT.negative >= 24",
            "support.JUMP.positive >= 12",
            "support.JUMP.negative >= 24",
            "meanFull >= 0.75",
            "minFull >= 0.65",
            "meanFull - meanOff >= 0.25",
            "meanShuffled",
            "meanTimeout <= 0.20",
            "meanJumps <= 1.75",
            "targetReach >= 0.85",
            "targetJump <= 0.30",
            "V11G3-JUMP-GATE="
          ];

          for (const token of required) {
            if (!s.includes(token)) {
              throw new Error("missing frozen contract: " + token);
            }
          }

          const randomWindow =
            /1\s*\+\s*Math\.floor\([\s\S]*?random\(\)\s*\*[\s\S]*?INTERVENTION_MAX_WINDOW/;
          const randomAction =
            /random\(\)\s*<\s*0\.5[\s\S]*?ACTION_WAIT[\s\S]*?ACTION_JUMP/;

          if (!randomWindow.test(s)) {
            throw new Error("random intervention window contract missing");
          }
          if (!randomAction.test(s)) {
            throw new Error("random intervention action contract missing");
          }

          const policyBlock =
            s.slice(
              s.indexOf("class MixedRewardPolicy"),
              s.indexOf("async function runPolicyEpisode")
            );

          for (const forbidden of [
            "withObstacle",
            "targetX",
            "obstacle",
            "distance",
            "side",
            "seed",
            "reward"
          ]) {
            if (policyBlock.includes(forbidden)) {
              throw new Error(
                "policy block contains forbidden state token: " +
                  forbidden
              );
            }
          }

          console.log(
            "V11G3-STATIC=PASS representation=CONCAT4 selected=256 persistence=2 cooldown=38"
          );
          NODE
