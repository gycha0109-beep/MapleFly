name: Verify MapleFly v11D Syntax

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-v11d-syntax.yml"
      - "scripts/experiment-v11d-outcome-classifier.mjs"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check Phase D runner
        run: node --check scripts/experiment-v11d-outcome-classifier.mjs
