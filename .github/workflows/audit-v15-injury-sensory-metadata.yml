name: Audit MapleFly v15 Injury Sensory Metadata

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/audit-v15-injury-sensory-metadata.mjs"
      - ".github/workflows/audit-v15-injury-sensory-metadata.yml"

permissions:
  contents: read

jobs:
  metadata-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check
        run: node --check scripts/audit-v15-injury-sensory-metadata.mjs
      - name: Cache pinned MaleCNS assets
        uses: actions/cache@v6
        with:
          path: .cache/maplefly-connectome
          key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e
      - name: Audit pinned sensory metadata
        run: node scripts/audit-v15-injury-sensory-metadata.mjs
      - name: Upload sensory metadata audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maplefly-v15-injury-sensory-metadata-${{ github.run_id }}
          path: results/audit-v15-injury-sensory-metadata
          if-no-files-found: warn
          retention-days: 30
