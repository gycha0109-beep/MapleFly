name: MapleFly science bootstrap
description: Shared Node/MaleCNS/tape-cache setup for science jobs

inputs:
  needs_malecns:
    description: Restore pinned MaleCNS cache
    required: false
    default: "true"
  needs_tapes:
    description: Restore Tape Pack cache
    required: false
    default: "false"
  tape_cache_key:
    description: Stable simulation+cohort cache key
    required: false
    default: "none"
  tape_cache_restore_prefix:
    description: Stable simulation-level restore prefix
    required: false
    default: "none-"

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: Restore pinned MaleCNS assets
      if: ${{ inputs.needs_malecns == 'true' }}
      uses: actions/cache@v6
      with:
        path: .cache/maplefly-connectome
        key: maplefly-male-cns-95a3dbcb05241b0a5c07028ca8ad945b23fbbe6e

    - name: Restore Tape Pack cache
      if: ${{ inputs.needs_tapes == 'true' }}
      uses: actions/cache@v6
      with:
        path: .cache/maplefly-tapes
        key: maplefly-tapes-v1-${{ runner.os }}-${{ inputs.tape_cache_key }}
        restore-keys: |
          maplefly-tapes-v1-${{ runner.os }}-${{ inputs.tape_cache_restore_prefix }}
